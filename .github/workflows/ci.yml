name: CI

# SECURITY (public repo): fork PRs run here with untrusted code. Keep this trigger on
# `pull_request` (never `pull_request_target`) and never add `id-token: write` or any
# cloud credentials to this workflow.
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (saves Actions minutes on rapid pushes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build & test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 18 is EOL; the dev toolchain (ESLint 10 / Vitest 4) needs 20+.
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Pillow backs the local image toolchain (python/*.py). Without it the OCR
      # preparation step degrades to a no-op, and the tests covering which
      # background it picks would have nothing to assert.
      - name: Install Pillow (local image toolchain)
        run: python3 -m pip install --break-system-packages --quiet pillow
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Validate package contents
        run: npm pack --dry-run
